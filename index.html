<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>สินค้าทั้งหมด</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      background: #f6f6f6;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      color: #222;

    }


    .container {

      width: 100%;

      max-width: 1200px;

      margin: auto;

      padding: 20px;

    }


    /* =========================
       USER
       ========================= */

    .user-box {

      display: flex;

      align-items: center;

      gap: 10px;

      background: #fff;

      padding: 12px 15px;

      border-radius: 12px;

      margin-bottom: 20px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.06);

    }


    .user-picture {

      width: 42px;

      height: 42px;

      border-radius: 50%;

      object-fit: cover;

    }


    .user-info {

      display: flex;

      flex-direction: column;

    }


    .user-name {

      font-weight: 600;

      font-size: 15px;

    }


    .user-id {

      font-size: 11px;

      color: #999;

    }


    /* =========================
       HEADER
       ========================= */

    .header {

      text-align: center;

      margin-bottom: 25px;

    }


    .header h1 {

      margin: 0;

      font-size: 28px;

    }


    .header p {

      margin: 8px 0 0;

      color: #777;

    }


    /* =========================
       PRODUCTS
       ========================= */

    .products {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(190px, 1fr)
        );

      gap: 16px;

    }


    .product {

      position: relative;

      background: #fff;

      border-radius: 14px;

      overflow: hidden;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.08);

      cursor: pointer;

      transition: .2s;

    }


    .product:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 7px 18px
        rgba(0,0,0,.12);

    }


    .product-image {

      width: 100%;

      aspect-ratio: 1 / 1;

      object-fit: cover;

      display: block;

      background: #eee;

    }


    .product-body {

      padding: 12px;

    }


    .product-name {

      font-size: 15px;

      line-height: 1.5;

      height: 45px;

      overflow: hidden;

      display: -webkit-box;

      -webkit-line-clamp: 2;

      -webkit-box-orient: vertical;

    }


    .buy-button {

      margin-top: 10px;

      background: #ee4d2d;

      color: #fff;

      text-align: center;

      padding: 9px;

      border-radius: 8px;

      font-size: 14px;

      font-weight: 600;

    }


    /* =========================
       SELECTED BADGE
       ========================= */

    .selected-badge {

      position: absolute;

      top: 10px;

      left: 10px;

      z-index: 2;

      display: flex;

      align-items: center;

      gap: 5px;

      max-width:
        calc(100% - 20px);

      padding: 6px 10px;

      background:
        rgba(0,0,0,.75);

      color: #fff;

      border-radius: 20px;

      font-size: 12px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

    }


    /* =========================
       LOADING
       ========================= */

    .loading {

      text-align: center;

      padding: 60px 20px;

      color: #777;

    }


    .error {

      text-align: center;

      padding: 50px 20px;

      color: #d32f2f;

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .container {

        padding: 12px;

      }


      .products {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;

      }


      .product-body {

        padding: 10px;

      }


      .product-name {

        font-size: 14px;

      }


      .buy-button {

        font-size: 13px;

        padding: 8px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       LINE USER
       ========================= -->

  <div
    id="userBox"
    class="user-box"
    style="display:none"
  >

    <img
      id="userPicture"
      class="user-picture"
      src=""
    >

    <div class="user-info">

      <div
        id="userName"
        class="user-name"
      >
        -
      </div>

      <div
        id="userId"
        class="user-id"
      >
        -
      </div>

    </div>

  </div>


  <!-- =========================
       HEADER
       ========================= -->

  <div class="header">

    <h1>
      🛍️ สินค้าทั้งหมด
    </h1>

    <p>
      เลือกสินค้าที่จะซื้อ
    </p>

  </div>


  <!-- =========================
       LOADING
       ========================= -->

  <div
    id="loading"
    class="loading"
  >

    กำลังเข้าสู่ระบบ LINE...

  </div>


  <!-- =========================
       PRODUCTS
       ========================= -->

  <div
    id="products"
    class="products"
  ></div>


  <div
    id="error"
    class="error"
    style="display:none"
  ></div>


</div>


<script>


// ========================================
// CONFIG
// ========================================

const LIFF_ID =
  "2011466675-0ULZbatW";


const API_URL =
  "https://script.google.com/macros/s/AKfycbx4FlTO2ZWEyEUBv_O2Uzrx6TDkReyIR_2oh_3QE2OlzrLgq6ihdvjAetLFMVbKTg46/exec";


// ========================================
// CURRENT USER
// ========================================

let CURRENT_USER = {

  userId: "",

  displayName: "",

  pictureUrl: ""

};


// ========================================
// INIT LIFF
// ========================================

async function initLiff() {

  try {

    /*
     * Initialize LINE LIFF
     */
    await liff.init({

      liffId:
        LIFF_ID

    });


    /*
     * ถ้ายังไม่ได้ Login
     */
    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    /*
     * ดึง Profile จาก LINE
     */
    const profile =
      await liff.getProfile();


    /*
     * เก็บข้อมูล User
     */
    CURRENT_USER = {

      userId:
        profile.userId,

      displayName:
        profile.displayName,

      pictureUrl:
        profile.pictureUrl || ""

    };


    console.log(
      "LINE USER:",
      CURRENT_USER
    );


    /*
     * แสดง User
     */
    showUser();


    /*
     * โหลดสินค้า
     */
    loadProducts();


  } catch (error) {

    console.error(
      "LIFF ERROR:",
      error
    );


    showError(
      "ไม่สามารถเข้าสู่ระบบ LINE ได้"
    );

  }

}


// ========================================
// SHOW USER
// ========================================

function showUser() {

  document.getElementById(
    "userBox"
  ).style.display = "flex";


  document.getElementById(
    "userName"
  ).textContent =
    CURRENT_USER.displayName;


  /*
   * ไม่แนะนำให้แสดง userId
   * ต่อผู้ใช้งานทั่วไป
   *
   * ถ้าไม่ต้องการแสดงให้ลบบรรทัดนี้
   */
  document.getElementById(
    "userId"
  ).textContent =
    CURRENT_USER.userId;


  if (
    CURRENT_USER.pictureUrl
  ) {

    document.getElementById(
      "userPicture"
    ).src =
      CURRENT_USER.pictureUrl;

  }

}


// ========================================
// LOAD PRODUCTS
// ========================================

async function loadProducts() {

  try {

    const response =
      await fetch(
        API_URL +
        "?action=products"
      );


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    renderProducts(
      result.data
    );


  } catch (error) {

    console.error(
      error
    );


    showError(
      "ไม่สามารถโหลดสินค้าได้"
    );

  }

}


// ========================================
// RENDER PRODUCTS
// ========================================

function renderProducts(
  products
) {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  const container =
    document.getElementById(
      "products"
    );


  if (
    !products ||
    products.length === 0
  ) {

    container.innerHTML = `

      <div
        style="
          grid-column:1/-1;
          text-align:center;
          padding:50px;
          color:#777;
        "
      >

        ยังไม่มีสินค้า

      </div>

    `;

    return;

  }


  container.innerHTML =
    products
      .map(product => {


        let badge = "";


        /*
         * ถ้ามีคนเลือกสินค้าแล้ว
         */
        if (
          product.selectedBy
        ) {

          badge = `

            <div
              class="selected-badge"
            >

              🟢

              ${escapeHtml(
                product
                  .selectedBy
                  .displayName
              )}

            </div>

          `;

        }


        return `

          <div
            class="product"
            data-product-id="${escapeHtml(
              product.id
            )}"
            onclick="
              selectProduct(
                '${escapeJs(product.id)}',
                '${escapeJs(product.url)}'
              )
            "
          >

            ${badge}


            <img
              class="product-image"
              src="${escapeHtml(
                product.image
              )}"
              alt="${escapeHtml(
                product.name
              )}"
              loading="lazy"
              onerror="
                this.src='https://placehold.co/600x600?text=No+Image'
              "
            >


            <div
              class="product-body"
            >

              <div
                class="product-name"
              >

                ${escapeHtml(
                  product.name
                )}

              </div>


              <div
                class="buy-button"
              >

                ดูสินค้า

              </div>

            </div>

          </div>

        `;

      })
      .join("");

}


// ========================================
// SELECT PRODUCT
// ========================================

async function selectProduct(
  productId,
  productUrl
) {


  /*
   * ป้องกันกรณี User ยังไม่มีข้อมูล
   */
  if (
    !CURRENT_USER.userId
  ) {

    alert(
      "กรุณาเข้าสู่ระบบ LINE ก่อน"
    );

    return;

  }


  /*
   * Stamp
   */
  await stampProduct(
    productId
  );


  /*
   * เปิด Shopee
   */
  if (productUrl) {

    window.open(
      productUrl,
      "_blank"
    );

  }

}


// ========================================
// STAMP PRODUCT
// ========================================

async function stampProduct(
  productId
) {

  try {

    const params =
      new URLSearchParams({

        action:
          "stamp",

        productId:
          productId,

        userId:
          CURRENT_USER.userId,

        displayName:
          CURRENT_USER.displayName

      });


    const response =
      await fetch(

        API_URL +
        "?" +
        params.toString()

      );


    const result =
      await response.json();


    if (!result.success) {

      console.error(
        result.message
      );

      return false;

    }


    /*
     * เปลี่ยน Badge ทันที
     * ไม่ต้อง reload ทั้งหน้า
     */
    updateProductBadge(
      productId,
      CURRENT_USER.displayName
    );


    return true;


  } catch (error) {

    console.error(
      "STAMP ERROR:",
      error
    );

    return false;

  }

}


// ========================================
// UPDATE BADGE
// ========================================

function updateProductBadge(
  productId,
  displayName
) {

  const product =
    document.querySelector(
      `[data-product-id="${CSS.escape(productId)}"]`
    );


  if (!product) {
    return;
  }


  let badge =
    product.querySelector(
      ".selected-badge"
    );


  /*
   * ถ้ายังไม่มี Badge
   */
  if (!badge) {

    badge =
      document.createElement(
        "div"
      );

    badge.className =
      "selected-badge";

    product.prepend(
      badge
    );

  }


  badge.innerHTML = `

    🟢
    ${escapeHtml(displayName)}

  `;

}


// ========================================
// ERROR
// ========================================

function showError(
  message
) {

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  const error =
    document.getElementById(
      "error"
    );


  error.style.display =
    "block";


  error.textContent =
    message;

}


// ========================================
// ESCAPE HTML
// ========================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ========================================
// ESCAPE JS
// ========================================

function escapeJs(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    );

}


// ========================================
// START
// ========================================

initLiff();


</script>


</body>

</html>
